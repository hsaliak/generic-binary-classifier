name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install
        run: make setup
      - name: Python quality and tests
        run: make quality && make test
      - name: Corpus separation
        run: |
          make corpus-report
          make corpus-report MANIFEST=tasks/prompt-complexity-v1.yaml DATASET=data/prompt-complexity/processed/development.jsonl EVALUATION=data/prompt-complexity/reviewed/locked-eval-v1.jsonl
      - name: Reproducible training and Python artifact verification
        run: |
          make train
          make infer TEXT='git status'
          make train MANIFEST=tasks/prompt-complexity-v1.yaml DATASET=data/prompt-complexity/processed/development.jsonl EVALUATION=data/prompt-complexity/reviewed/locked-eval-v1.jsonl ARTIFACT_DIR=artifacts/prompt-complexity-v1
          make infer ARTIFACT_DIR=artifacts/prompt-complexity-v1 TEXT='continue'
      - name: Go checks and bounded fuzzing
        run: >-
          cd go && go test ./... &&
          go test -run=^$ -fuzz=FuzzClassifyNeverReturnsInvalidProbability -fuzztime=2s ./cmd/command-classify &&
          go test -run=^$ -fuzz=FuzzV3ArtifactParsing -fuzztime=2s ./cmd/command-classify
