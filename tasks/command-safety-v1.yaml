task_id: command-safety
task_version: v1
input:
  fields: [text]
labels:
  values: [safe, unsafe]
  positive_class: unsafe
data:
  record_schema: schemas/classification-record-v1.json
  prompt: prompts/command-safety-v1.md
  raw_directory: data/command-safety/raw
  processed_dataset: data/command-safety/processed/development.jsonl
  locked_evaluation: data/command-safety/reviewed/locked-eval-source-disjoint-v1.jsonl
  split_group_fields: [family, batch_id]
generation:
  backend: std_slop
  model: gpt-5.6-terra:medium
model:
  feature_profile: word_and_character_tfidf
  estimator: logistic_regression
  random_seed: 20250221
evaluation:
  outer_folds: 5
  inner_folds: 3
  primary_metric: positive_recall
decision_policy:
  positive_probability_threshold: 0.50
  review_probability_range: [0.20, 0.90]
